name: Feature Request
about: Suggest a new component, token, or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / Use Case
      description: Why is this needed? What problem does it solve?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - must-have
        - nice-to-have
        - would-be-nice
    validations:
      required: true
